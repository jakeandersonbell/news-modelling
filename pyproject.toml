[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-modelling"
version = "0.1.0"
description = "Quantifying narrative trends, media plurality, and editorial framing across news providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBC" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    # retrieval / extraction
    "trafilatura>=1.6",
    "warcio>=1.7",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "pytest>=7.4",
    "ruff>=0.4",
]
bigquery = [
    "google-cloud-bigquery>=3.11",
    "db-dtypes>=1.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
